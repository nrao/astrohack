[project]
name = "astrohack"
version = "1.1.0"
description = "Holography Antenna Commissioning Kit"
readme = "README.md"
requires-python = ">= 3.11, < 3.14"
dependencies = [ "astropy", "dask", "shapely", "distributed", "toolviper", "ipywidgets", "matplotlib", "numba>=0.57.0", "numpy<=2.2", "prettytable", "pycryptodome", "pytest", "pytest-cov", "pytest-html", "scikit_image", "scikit-learn", "scipy", "rich", "xarray", "zarr<3.0.0", "bokeh", "pillow", "jupyterlab", "casacoretables>=0.0.3",]
[[project.authors]]
name = "Joshua Hoskins"
email = "jhoskins@nrao.edu"

[[project.authors]]
name = "Victor de Souza Magalhaes"
email = "vdesouza@nrao.edu"

[[project.authors]]
name = "Jan-Willem Steeb"
email = "jsteeb@nrao.edu"

[project.license]
file = "LICENSE.txt"

[project.optional-dependencies]
docs = [ "pandoc", "sphinx-autosummary-accessors", "nbsphinx", "sphinx_rtd_theme", "recommonmark", "sphinx-autoapi", "ipython",]

[project.scripts]
beamcut-reduction-pipeline = "astrohack.scripts.beamcuts.beamcut_reduction_pipeline:main"
baseline-reduction-pipeline = "astrohack.scripts.baseline.baseline_reduction_pipeline:main"

[tool.ruff]
target-version = "py312"
# Notebooks were not formatted by black either.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# Same rule set as the VIPER packages (toolviper, xradio, graphviper,
# astroviper):
#   E4/E7/E9 -- pycodestyle errors (import placement, statement syntax, runtime)
#   F        -- pyflakes: undefined names, unused imports, unused variables
#   B        -- flake8-bugbear: likely bugs (mutable defaults, loop captures, ...)
#   UP       -- pyupgrade: outdated syntax/typing
#   I        -- isort-compatible import sorting
select = ["E4", "E7", "E9", "F", "B", "UP", "I"]
# Findings that need hand edits, ignored so the switch from black to ruff is
# style-only. TODO: fix them and drop the corresponding entries.
ignore = [
    "B007",  # unused loop control variable
    "B008",  # function call in argument default
    "B011",  # assert False
    "B017",  # pytest.raises(Exception)
    "B018",  # useless expression
    "B030",  # except with a non-exception class
    "B904",  # raise without `from` inside except
    "B905",  # zip() without strict=
    "UP030", # explicit positional indices in str.format
    "UP031", # printf-style string formatting
]
