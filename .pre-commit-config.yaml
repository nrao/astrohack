# Packaged telescope data (zarr stores) is not source code.
exclude: ^src/astrohack/data/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: check-ast
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-json
        # JSON with comments.
        exclude: ^asv\.conf\.json$
      - id: check-toml
      - id: check-yaml
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: requirements-txt-fixer
      - id: trailing-whitespace
        args: [--chars,"  "]

  - repo: https://github.com/asottile/pyupgrade
    rev: v2.38.2
    hooks:
      - id: pyupgrade
        args:
          - --py311-plus

  -   repo: https://github.com/MarcoGorelli/absolufy-imports
      rev: v0.3.1
      hooks:
      - id: absolufy-imports
        name: absolufy-imports

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check        # linter + import sorting (see ruff.toml)
        args: [--fix]
      - id: ruff-format       # formatter (black replacement)

  # NOTE: no nbstripout hook here. The tutorial notebooks under docs/tutorials/
  # are rendered by nbsphinx from their *stored* outputs (nbsphinx_execute =
  # "never" in docs/conf.py) -- stripping outputs would blank the rendered
  # documentation.
